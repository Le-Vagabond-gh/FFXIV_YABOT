name: Build and Release

on:
  push:
    paths:
      - 'yabot/**.cs'
      - 'yabot/**.csproj'
      - 'yabot/**.json'
      - 'yabot.sln'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        run: |
          curl -L https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -o dalamud.zip
          unzip dalamud.zip -d dalamud
          rm dalamud.zip

      - name: Build
        env:
          DALAMUD_HOME: ${{ github.workspace }}/dalamud
        run: dotnet build -c Release --property:WarningLevel=0
        working-directory: yabot

      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(date +'%Y%m%d%H%M%S')-${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Package full plugin zip
        id: package
        run: |
          # Dalamud.NET.Sdk already emits a complete plugin package (yabot.dll, yabot.json,
          # yabot.deps.json and the ECommons project reference) - reuse it rather than
          # assembling the file list by hand, so a new dependency can't be forgotten.
          SDK_ZIP=$(find yabot/bin/Release -name latest.zip -print -quit)
          if [ -z "$SDK_ZIP" ]; then
            echo "::error::Dalamud SDK plugin zip not found under yabot/bin/Release"
            exit 1
          fi
          ZIP="yabot-${{ steps.tag.outputs.tag }}-full.zip"
          cp "$SDK_ZIP" "$ZIP"
          unzip -l "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yabot
          path: |
            ${{ steps.package.outputs.zip }}
            yabot/bin/Release/yabot.dll
            yabot/bin/Release/yabot.json

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          # Get the previous tag for changelog
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # Generate changelog from commits
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD)
            CHANGELOG_LINK="**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...$TAG"
            NOTES="$COMMITS"$'\n\n'"$CHANGELOG_LINK"
          else
            NOTES=$(git log --pretty=format:"- %s" 2>/dev/null || echo "Initial release")
          fi

          {
            echo "$NOTES"
            echo
            echo "## Installing"
            echo
            echo "First install: download **$ZIP** and extract it - it holds the plugin plus the dependencies it needs to load. Point the Dalamud dev plugin location at the extracted \`yabot.dll\`."
            echo
            echo "Updating an existing install: \`yabot.dll\` and \`yabot.json\` on their own are enough."
          } > release-notes.md

          gh release create "$TAG" \
            "$ZIP" \
            yabot/bin/Release/yabot.dll \
            yabot/bin/Release/yabot.json \
            --notes-file release-notes.md \
            --title "Release $TAG"
